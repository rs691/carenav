[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carenav"
version = "0.1.0"
description = "Multi-tenant healthcare AI benefits platform"
requires-python = ">=3.12"
dependencies = [
    "langgraph==0.2.55",
    "langchain==0.3.7",
    "langchain-openai==0.2.5",
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.1",
    "python-jose[cryptography]==3.3.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "asyncpg>=0.30.0",
    "qdrant-client==1.12.0",
    "openai>=1.0.0",
    "pdfplumber==0.11.4",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.3",
]

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "api",
    "core",
    "evals",
    "middleware",
    "orchestrator",
    "prompts",
    "rag",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
